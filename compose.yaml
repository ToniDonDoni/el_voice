name: el-voice

x-voice-image: &voice-image
  image: el-voice:dev
  platform: linux/arm64
  build:
    context: .

services:
  voice:
    <<: *voice-image
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    init: true
    volumes:
      - ./workspace:/workspace:ro
      - ./models:/models:ro
      - ./data:/data
    networks: [private]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 6
    mem_limit: 10g
    pids_limit: 256
    stop_grace_period: 15s

  proxy:
    image: nginx/nginx-unprivileged:1.30.6-alpine
    platform: linux/arm64
    depends_on:
      voice:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EL_VOICE_PORT:-8765}:8080"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [private, ingress]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 128m
    pids_limit: 64
    stop_grace_period: 10s

  download:
    <<: *voice-image
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    profiles: [setup]
    init: true
    command: [python, /opt/el-voice/download_models.py]
    volumes:
      - ./models:/models
    networks: [downloads]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true

networks:
  private:
    internal: true
  ingress: {}
  downloads: {}
